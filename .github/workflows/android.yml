name: Build Qadrax Engine APK
on: 
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code Node
        uses: actions/checkout@v4

      - name: Setup Pristine Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pure Linux Compilation Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev liblzma-dev

      - name: Install Core Pipeline Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Execute Buildozer Cloud Packaging Engine
        run: |
          buildozer android debug
        env:
          TERM: xterm

      - name: Extract and Deploy Certified APK File
        uses: actions/upload-artifact@v4
        with:
          name: Qadrax-Engine-5.2-Debug-APK
          path: bin/*.apk
