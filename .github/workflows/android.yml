- name: Execute Android APK Target Production Build
      run: |
        # Quiet mode (-q) lagaya hai taaki long truncated graphic logs terminal stream ko crash na karein
        buildozer -q android debug
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGN: 1
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_ROOT: ""
        ANDROID_NDK: ""
