name: Qadrax Engine Android Build Workflow

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Java JDK Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer and Android SDK Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.android
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install System Dependencies & Build Tools (Fixed)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libsqlite3-dev \
          sqlite3 \
          libssl-dev \
          libffi-dev \
          libgmp-dev \
          pkg-config \
          autoconf \
          automake \
          libtool \
          gettext \
          m4 \
          patch \
          unzip \
          zip \
          unrar-free \
          bzip2 \
          libbz2-dev

    - name: Install Cython & Buildozer Package Tools
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0"
        pip install buildozer virtualenv sh

    - name: Clean Previous Broken Artifact Profiles
      run: |
        # Purane tute hue build ki directories ko clear karna zaroori hai
        rm -rf .buildozer/android/platform/build-*
        buildozer android clean || true

    - name: Execute Android APK Target Production Build
      run: |
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGN: 1
        # GitHub Actions ke default naye NDK ko bypass karne ke liye env variables khaali choren takay buildozer apna sahi version (r25c) download kare
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_ROOT: ""

    - name: Upload Qadrax Engine APK Package Node Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Qadrax-Engine-v5.2-Android-Debug
        path: bin/*.apk
        retention-days: 7
