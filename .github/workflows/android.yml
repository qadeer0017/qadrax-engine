name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        # FIX: Missing dependencies ko force-fix ke sath install karna
        sudo apt-get install -y -f libunwind-dev
        sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libgstreamer-plugins-base1.0-dev openjdk-17-jdk unzip zip libtool-bin m4
        
        # Macro tree links recovery for autoconf
        sudo cp /usr/share/aclocal/libtool.m4 /usr/share/aclocal/ltoptions.m4 || true
        sudo cp /usr/share/aclocal/libtool.m4 /usr/share/aclocal/ltsugar.m4 || true
        sudo cp /usr/share/aclocal/libtool.m4 /usr/share/aclocal/ltversion.m4 || true
        sudo cp /usr/share/aclocal/libtool.m4 /usr/share/aclocal/lt~obsolete.m4 || true

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" Cython virtualenv

    - name: Reset Workspace Cache
      run: |
        rm -rf .buildozer/
        rm -rf bin/
        rm -rf ~/.buildozer/

    - name: Build with Buildozer
      run: |
        YES=1 buildozer -v android debug
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
