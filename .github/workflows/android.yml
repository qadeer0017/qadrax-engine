name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libgstreamer-plugins-base1.0-dev openjdk-17-jdk unzip zip libtool-bin m4 autopoint gettext

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" Cython virtualenv

    - name: Clean Previous Broken Cache
      run: |
        rm -rf .buildozer/
        rm -rf bin/
        rm -rf ~/.buildozer/

    - name: Build with Buildozer
      run: |
        # P4A_BOOTSTRAP_COMPAT force-bypasses the broken legacy build chains
        YES=1 buildozer -v android debug
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        P4A_BOOTSTRAP_COMPAT: "1"
